[versions]
kotlin = "2.4.21"
kotlin-coroutines = "1.11.0"
ktor = "3.6.0"
arrow = "2.3.0.1"
kotest = "6.2.6"
# https://developer.android.com/develop/ui/compose/bom/bom-mapping (BOM 2026.09.00)
compose = "1.12.1"
compose-material3 = "1.4.0"
# Material icons stopped following the Compose version at 1.7.8
compose-material-icons = "1.7.8"
glance = "1.2.0"
hilt = "2.60.1"
# hilt-work and its compiler must match: the compiler generates code against that runtime.
androidx-hilt = "1.4.0"
room = "2.8.5"
androidx-work = "2.12.0"
kotlinx-collections = "0.5.2"
paparazzi = "2.0.0-alpha05.1"

# Android
min-sdk = "28"
compile-sdk = "37"
target-sdk = "36"
version-name = "2025.07.17"
version-code = "206"
jvm-target = "17"


# Linters
detekt = "1.23.8" # https://detekt.dev/docs/gettingstarted/gradle/

# Minimum Bouncy Castle for the build tools (see the build-tooling-minimums bundle).
bouncycastle = "1.86"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version = "9.4.0" }

# Kotlin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections" }

# KotlinX Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
kotlinx-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

# Ktor
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Arrow
arrowkt-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }

# Testing
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-assertions-arrow = { module = "io.kotest:kotest-assertions-arrow", version.ref = "kotest" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
cashapp-molecule-runtime = { module = "app.cash.molecule:molecule-runtime", version = "2.2.0" }
cashapp-turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
paparazzi-plugin = { module = "app.cash.paparazzi:paparazzi-gradle-plugin", version.ref = "paparazzi" }
paparazzi = { module = "app.cash.paparazzi:paparazzi", version.ref = "paparazzi" }
google-testparameterinjector = { module = "com.google.testparameterinjector:test-parameter-injector", version = "1.25" }

# Integartion (Android) testing
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-core = { module = "androidx.test:core-ktx", version = "1.7.0" }
androidx-test-ext = { module = "androidx.test.ext:junit-ktx", version = "1.3.0" }
mockk-android = { module = "io.mockk:mockk-android", version = "1.14.11" }

# Compose
compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-runtime-livedate-temp = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.0" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
glance = { module = "androidx.glance:glance", version.ref = "glance" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

# Room
room-plugin = { module = "androidx.room:androidx.room.gradle.plugin", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

datastore = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }

# Hilt
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidx-hilt" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

# AndroidX
androidx-biometrics = { module = "androidx.biometric:biometric", version = "1.4.0-alpha07" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
appcompat-activity = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }

# Legacy
keval = { module = "com.notkamui.libs:keval", version = "2.0.1" }
opencsv-csv = { module = "com.opencsv:opencsv", version = "5.12.0" }
opencsv-apache-commons = { module = "org.apache.commons:commons-lang3", version = "3.21.0" }

# Linters
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
# The Compose rules are pinned for detekt 1.23 (see the ignore list in .github/dependabot.yml).
detekt-ruleset-ktlint = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-ruleset-compose = { module = "io.nlopez.compose.rules:detekt", version = "0.4.10" }
slack-lint-compose = { module = "com.slack.lint.compose:compose-lint-checks", version = "1.6.1" }

# KSP
ksp-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version = "2.3.12" }

# Modules Graph
module-graph-plugin = { module = "com.jraska.module.graph.assertion:plugin", version = "2.9.1" }

# Minimum versions for libraries the build tools pull in (the Gradle plugins, lint, the SDK
# libraries, test runners); older ones have known vulnerabilities. Nothing depends on these
# directly: gradle/minimum-versions.gradle.kts raises anything older to them, and listing them
# here lets Dependabot keep them current.
minimum-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
minimum-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
minimum-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
minimum-guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
minimum-jose4j = { module = "org.bitbucket.b_c:jose4j", version = "0.9.7" }
minimum-jdom2 = { module = "org.jdom:jdom2", version = "2.0.6.1" }
minimum-httpclient = { module = "org.apache.httpcomponents:httpclient", version = "4.5.14" }


[bundles]
# Minimum versions for the build tools' libraries, applied by gradle/minimum-versions.gradle.kts.
# commons-lang3 uses the version the project itself depends on.
build-tooling-minimums = [
    "minimum-bcprov",
    "minimum-bcpkix",
    "minimum-bcutil",
    "minimum-guava",
    "minimum-jose4j",
    "minimum-jdom2",
    "minimum-httpclient",
    "opencsv-apache-commons",
]
kotlin = [
    "kotlin-stdlib",
    "kotlin-coroutines-core",
    "kotlinx-collections-immutable"
]
kotlin-android = [
    "kotlin-coroutines-android",
]
arrow = [
    "arrowkt-core",
]
ktor = [
    "kotlinx-serialization-json",
    "ktor-client-okhttp",
    "ktor-content-negotiation",
    "ktor-serialization",
    "ktor-client-core",
    "ktor-logging",
]
testing = [
    "kotest-assertions",
    "kotest-property",
    "kotest-assertions-arrow",
    "kotlin-coroutines-test",
    "mockk",
    "cashapp-turbine",
    "google-testparameterinjector"
]
integration-testing = [
    "kotest-assertions",
    "kotest-assertions-arrow",
    "kotlin-coroutines-test",
    "androidx-test-core",
    "androidx-test-runner",
    "androidx-test-ext"
]
compose = [
    "compose-animation",
    "compose-foundation",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-runtime",
    "compose-ui",
    "compose-activity",
    "compose-viewmodel",
    "compose-tooling",
    "compose-runtime-livedate-temp",
]
activity = [
    "androidx-activity",
    "appcompat-activity"
]
glance = [
    "glance",
    "glance-appwidget",
]
hilt = [
    "hilt",
    "hilt-work"
]
room = [
    "room-runtime",
    "room-ktx"
]
opencsv = [
    "opencsv-csv",
    "opencsv-apache-commons"
]
