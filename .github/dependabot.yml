# Weekly update PRs for the Gradle dependencies (gradle/libs.versions.toml and the Gradle
# wrapper) and the GitHub Actions the workflows use. CI and CodeQL run on each PR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates come as one PR; each major update gets its own.
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Compose rules stay on the last release that works with detekt 1.23 as we use it;
      # detekt 2 is still in alpha. Compose rules 0.5+ are built for detekt 2, and 0.4.25+ need a
      # newer Kotlin than detekt 1.23 runs on. 0.4.11-0.4.24 work, but their new and changed
      # checks flag 168 places that pass today. Revisit when moving to detekt 2.
      - dependency-name: 'io.nlopez.compose.rules:detekt'
      # KSP 2.3.13 failed this build: Hilt's processing couldn't resolve HiltViewModel (#155), a
      # regression its release notes own (google/ksp#3286). The next KSP comes as usual.
      - dependency-name: 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin'
        versions: ['2.3.13']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
