# CodeQL code scanning for the app's Kotlin, this repository's workflows and its Python scripts.
#
# GitHub's default CodeQL setup can't analyse this project: its automatic build runs
# `gradlew testClasses`, a task Android modules don't have, so it dropped Java/Kotlin and only
# scanned the rest. This workflow builds the app itself so CodeQL sees the Kotlin compiler run.
# It replaces default setup, which has to be off for this workflow's results to be accepted
# (Settings > Code security > Code scanning > CodeQL analysis).
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  # Weekly, so new CodeQL queries also run on code that hasn't changed.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL reads the Kotlin compiler as it runs, so every module has to compile here: no
      # build cache, and the compiler stays inside this step's processes.
      - name: Build the app
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew :app:assembleDebug
          --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results

      # The findings, as the Security tab ranks them, so they can be read in the job log too.
      - name: List the findings
        run: |
          python3 -I - sarif-results/*.sarif <<'PY'
          import json, sys

          def severity(rule):
              props = rule.get("properties", {})
              score = props.get("security-severity")
              if score is not None:
                  s = float(score)
                  return "critical" if s >= 9 else "high" if s >= 7 else "medium" if s >= 4 else "low"
              return props.get("problem.severity") or rule.get("defaultConfiguration", {}).get("level", "?")

          order = ["critical", "high", "medium", "low", "error", "warning", "recommendation", "note"]
          for path in sys.argv[1:]:
              for run in json.load(open(path)).get("runs", []):
                  tool = run["tool"]
                  rules = {r["id"]: r for c in [tool["driver"], *tool.get("extensions", [])]
                           for r in c.get("rules", [])}
                  found = []
                  for res in run.get("results", []):
                      rule_id = res.get("ruleId") or res.get("rule", {}).get("id")
                      loc = (res.get("locations") or [{}])[0].get("physicalLocation", {})
                      found.append((
                          severity(rules.get(rule_id, {})), rule_id,
                          f'{loc.get("artifactLocation", {}).get("uri", "?")}:{loc.get("region", {}).get("startLine", "?")}',
                          res.get("message", {}).get("text", "").replace("\n", " "),
                      ))
                  found.sort(key=lambda f: order.index(f[0]) if f[0] in order else len(order))
                  print(f"{path}: {len(found)} finding(s)")
                  for sev, rule_id, where, message in found:
                      print(f"  [{sev}] {rule_id} {where}: {message}")
          PY

      # CodeQL skips Kotlin it can't read (a Kotlin version newer than it supports) instead of
      # failing, and the Java that Room and Hilt generate would still give it something to
      # analyse. So check the line counts it reports and fail if it saw no Kotlin.
      - name: CodeQL read the Kotlin code
        if: matrix.language == 'java-kotlin'
        run: |
          python3 -I - sarif-results/java.sarif <<'PY'
          import json, sys
          sarif = json.load(open(sys.argv[1]))
          metrics = {
              m.get("ruleId") or m.get("rule", {}).get("id"): m.get("value")
              for run in sarif.get("runs", [])
              for m in run.get("properties", {}).get("metricResults", [])
          }
          for rule, value in sorted(metrics.items()):
              print(f"{rule}: {value}")
          if not metrics.get("java/summary/lines-of-code-kotlin"):
              print("::error::CodeQL read no Kotlin code. Does it support this Kotlin version yet?")
              sys.exit(1)
          PY
