# CodeQL code scanning for the app's Kotlin, this repository's workflows and its Python scripts.
#
# GitHub's default CodeQL setup can't analyse this project: its automatic build runs
# `gradlew testClasses`, a task Android modules don't have, so it dropped Java/Kotlin and only
# scanned the rest. This workflow builds the app itself so CodeQL sees the Kotlin compiler run.
# It replaces default setup, which has to be off for this workflow's results to be accepted
# (Settings > Code security > Code scanning > CodeQL analysis).
#
# The Kotlin analysis is the slow part (10 minutes or more): CodeQL reads the compiler as it
# runs, so every module compiles from scratch, and build mode "none" is Java-only and would
# drop the Kotlin. It therefore only runs when a commit touches what it reads: Kotlin, Java,
# build scripts, manifests, XML resources, or this file. A dependency bump or a docs change
# doesn't start it (the Dependencies workflow covers dependencies). The weekly and manual runs
# analyse everything, so new CodeQL queries also meet unchanged code.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Did code CodeQL reads change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) changed=$(gh pr diff "$PR" --name-only) ;;
            push)
              # A new branch or a force-push has no usable "before": analyse.
              if [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
                  || ! git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
                changed=everything
              else
                changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              fi ;;
            *) changed=everything ;;
          esac
          if [ "$changed" = everything ] \
              || grep -qE '\.(kt|kts|java)$|AndroidManifest\.xml$|/res/xml/|^\.github/workflows/codeql\.yml$' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No Kotlin, Java, build script, manifest or XML resource changed: the Kotlin analysis is skipped."
          fi

  kotlin:
    name: Analyze (java-kotlin)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL reads the Kotlin and Java compilers as they run, so every module has to compile
      # here: no build cache, and the compiler stays inside this step's processes. Compiling is
      # all it needs; dexing, resource merging and packaging would add minutes and nothing to
      # read. Hilt's generated components are compiled too, as in a real build.
      - name: Compile the app
        run: >-
          ./gradlew compileDebugJavaWithJavac :app:hiltJavaCompileDebug
          --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: sarif-results

      - name: List the findings
        run: python3 -I scripts/listSarifFindings.py sarif-results/*.sarif

      # CodeQL skips Kotlin it can't read (a Kotlin version newer than it supports) instead of
      # failing, and the Java that Room and Hilt generate would still give it something to
      # analyse. So check the line counts it reports and fail if it saw no Kotlin.
      - name: CodeQL read the Kotlin code
        run: |
          python3 -I - sarif-results/java.sarif <<'PY'
          import json, sys
          sarif = json.load(open(sys.argv[1]))
          metrics = {
              m.get("ruleId") or m.get("rule", {}).get("id"): m.get("value")
              for run in sarif.get("runs", [])
              for m in run.get("properties", {}).get("metricResults", [])
          }
          for rule, value in sorted(metrics.items()):
              print(f"{rule}: {value}")
          if not metrics.get("java/summary/lines-of-code-kotlin"):
              print("::error::CodeQL read no Kotlin code. Does it support this Kotlin version yet?")
              sys.exit(1)
          PY

  # The workflows and the Python scripts: no build, a minute or two.
  scripts:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results

      - name: List the findings
        run: python3 -I scripts/listSarifFindings.py sarif-results/*.sarif
