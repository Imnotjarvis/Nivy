# Builds Nivy (offline) and tests it; for v* tags and "release" runs, also the signed APK, as a
# download. Nothing is published anywhere.
#
# Jobs:
#   plan    decides what this run needs (scripts/ciPlan.sh, explained in the run summary)
#   checks  offline guard, detekt and module dependency rules (no compiling); detekt's findings
#           also go to the Security tab (code scanning)
#   build   debug APK ("apk-debug" artifact); when the device job runs, also the instrumented
#           tests
#   demo    the R8-minified "demo" APK, signed with the committed debug key ("apk-demo"
#           artifact); only when the device job runs. Its own job, in parallel with build: R8
#           and the release-variant compile take longer than the debug build. In a release run,
#           also the signed release APK, whose signing key it checks ("apk-release")
#   test    unit tests, and screenshot tests compared with their reference images; in parallel
#           with build
#   device  launches the APKs on an emulator and runs the instrumented tests; launch
#           screenshots are in its "device-results" artifact
#   lint    Android Lint; fails on errors, prints warnings. Its findings also go to the Security
#           tab (code scanning)
# Any Kotlin compiler warning fails the compile (allWarningsAsErrors in build.gradle.kts).
#
# What runs when:
#   push to a branch        checks, build, test; device only when the change can reach app
#                           startup or the APK build (not for other features, widgets, unit
#                           tests or docs); no lint
#   push to a branch named  checks and build only; build also compiles the unit tests
#   claude/experimental-*
#   push to main, tag,      everything
#   nightly, manual run
#   docs-only push          nothing
# Gradle's build cache is saved per commit, so a run only recompiles and retests the modules its
# changes can affect.
#
# Manual runs (Actions > Build > Run workflow) take an "action":
#   build                 everything
#   release               everything, plus the signed APK (see "Signed APKs" below)
#   record-screenshots    re-records the screenshot tests' reference images, commits them and
#                         starts a "build" run on the new commit
#
# Artifacts are kept for 3 days and the signed APK for 1; an older APK can be rebuilt from its
# commit.
#
# Signed APKs: push a tag such as v2026.11.01, or run the workflow by hand with "release". The
# demo job builds the APK with the release key and checks which key signed it, the device job
# installs that very file on the emulator and goes through onboarding to Home, and the release
# job keeps it as the run's "Nivy-<version>" artifact, with its checksum in the run summary.
# Nothing is published: no GitHub release, no store. The APK's version comes from the commit
# it's built from (its date and time, see app/build.gradle.kts), so a later commit's APK always
# installs over an earlier one's.
# It needs four repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   RELEASE_KEYSTORE_BASE64  output of: base64 -w0 release.jks
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        the key's alias in release.jks
#   RELEASE_KEY_PASSWORD     key password
# and one variable (the same page, Variables):
#   RELEASE_CERT_SHA256      the SHA-256 of the key's certificate: keytool -list -v -keystore
#                            release.jks prints it, as does the first run without it
# An APK signed with another key stops the run, as Android wouldn't let it update the app.
# Use the same release.jks as your local builds, so CI and local APKs update each other.
#
# Jobs run on an explicit Ubuntu 26.04 image rather than ubuntu-latest, so an image switch
# never changes the build without a commit here.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # No path filter: a workflow that doesn't start reports no checks, and a ruleset that
    # requires them would then block a docs-only pull request. The plan job skips the work
    # instead, and skipped jobs report their checks as passed.
  # Nightly, on the default branch only (GitHub runs schedules from there). It skips itself
  # on days without commits.
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        default: build
        options: [build, release, record-screenshots]

# Read-only by default; record-screenshots asks for contents: write itself.
permissions:
  contents: read

concurrency:
  # Manual maintenance runs and pushes to the same branch don't cancel each other.
  group: build-${{ github.ref }}-${{ inputs.action || github.event_name }}
  cancel-in-progress: true

env:
  # Gradle's local build cache (settings.gradle.kts reads this). It lives outside Gradle's home so
  # the setup-gradle dependency cache stays small, and is saved under a per-commit key below.
  GRADLE_BUILD_CACHE_DIR: ${{ github.workspace }}/.gradle/ci-build-cache

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      test: ${{ steps.plan.outputs.test }}
      device: ${{ steps.plan.outputs.device }}
      lint: ${{ steps.plan.outputs.lint }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what this run needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          scripts/ciPlan.sh >> "$GITHUB_OUTPUT" 2> plan.txt
          cat plan.txt
          echo "**Plan:** $(cat plan.txt)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Offline guard
        run: scripts/verifyOffline.sh

      # The configuration cache isn't kept between CI runs, so skipping it here costs nothing.
      - name: Detekt and module dependency rules
        run: ./gradlew :detekt :assertModuleGraph --continue --no-configuration-cache

      # Detekt's findings in the Security tab and on pull requests.
      - name: Upload detekt results to code scanning
        if: ${{ !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: detekt-report
          retention-days: 3
          path: build/reports/detekt/
          if-no-files-found: ignore

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) cache: one entry per hash of the build files. Only the
          # "test" job saves it (this job when tests don't run); parallel jobs saving the same
          # key collide and warn.
          cache-provider: basic
          cache-read-only: ${{ needs.plan.outputs.test == 'true' }}

      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-build-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-build-
            gradle-build-cache-

      # The instrumented tests are only built for the device job, which takes the compiled tests
      # from this job's build cache. When the test job doesn't run, the unit tests are still
      # compiled here.
      - name: Build APKs
        env:
          DEVICE_TASKS: >-
            ${{ needs.plan.outputs.device == 'true' &&
            ':shared:data:core:assembleDebugAndroidTest :shared:domain:assembleDebugAndroidTest' || '' }}
          TEST_TASKS: ${{ needs.plan.outputs.test != 'true' && 'compileDebugUnitTestSources' || '' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug $DEVICE_TASKS $TEST_TASKS --continue 2>&1 | tee gradle-output.log

      # Pruned and saved even when the build fails: entries of the tasks that succeeded stay valid.
      - name: Drop build cache entries older than a week
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: find "$GRADLE_BUILD_CACHE_DIR" -maxdepth 1 -type f -mtime +7 -delete 2>/dev/null || true

      - name: Save build cache
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-build-${{ github.sha }}

      - name: Audit shipped libraries
        run: scripts/auditRuntimeDependencies.sh

      # Room writes each schema version into the module's schemas folder, and the migration tests
      # read it from there, so a new version has to be committed. The files are in the artifact,
      # and printed below for when the artifact can't be downloaded.
      - name: Room schemas are committed
        run: |
          changed=$(git status --porcelain -- ':(glob)**/schemas/**')
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- ':(glob)**/schemas/**'
            git ls-files --others --exclude-standard -- ':(glob)**/schemas/**' | while read -r f; do
              echo "::group::$f"
              cat "$f"
              echo
              echo "::endgroup::"
            done
            echo "::error::Room wrote schema files that aren't committed. Commit the room-schemas artifact."
            exit 1
          fi

      - name: Upload Room schemas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          retention-days: 3
          path: '**/schemas/**/*.json'

      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          retention-days: 3
          path: app/build/outputs/apk/debug/*.apk

      # Last, so the end of a long log still shows them, followed by counts per module. Modules
      # taken from the build cache print no warnings.
      - name: List compiler errors and warnings
        if: ${{ !cancelled() }}
        run: |
          grep -E '^[ew]: ' gradle-output.log | sed "s#file://$PWD/##" | sort -u > diagnostics.txt || true
          cat diagnostics.txt
          echo "== $(grep -c '^e: ' diagnostics.txt) errors, $(grep -c '^w: ' diagnostics.txt) warnings"
          sed -E 's#^([ew]): (.*)/src/.*#\1 \2#' diagnostics.txt | sort | uniq -c | sort -rn

      # A compile that fails on warnings only logs "warnings found and -Werror specified".
      - name: Compiler problems
        if: failure()
        run: python3 -I scripts/printCompilerProblems.py

  # The R8-minified demo APK the device job launches to catch what minification breaks (keep
  # rules, Hilt, Room). R8 alone takes about 4 minutes, after a release-variant compile of every
  # module, so it runs beside the debug build rather than after it: the emulator waits for the
  # slower of the two instead of their sum. A release run also builds the signed APK here, from
  # the same compile, so the emulator launches the very file the release job keeps.
  demo:
    needs: plan
    if: needs.plan.outputs.device == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.signed.outputs.version }}
      sha256: ${{ steps.signed.outputs.sha256 }}
      cert: ${{ steps.signed.outputs.cert }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Release-variant outputs, so its own cache family; falls back to any other job's.
      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-demo-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-demo-
            gradle-build-cache-

      - name: Build the demo APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDemo 2>&1 | tee gradle-output.log

      - name: Restore release key
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Add the RELEASE_* secrets described at the top of build.yml first."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build the signed APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'release'
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee gradle-output.log

      - name: Check which key signed it
        id: signed
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'release'
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: scripts/checkReleaseApk.sh app/build/outputs/apk/release/app-release.apk >> "$GITHUB_OUTPUT"

      - name: Drop build cache entries older than a week
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: find "$GRADLE_BUILD_CACHE_DIR" -maxdepth 1 -type f -mtime +7 -delete 2>/dev/null || true

      - name: Save build cache
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-demo-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: apk-demo
          retention-days: 3
          path: app/build/outputs/apk/demo/*.apk

      # For the device job; the release job keeps it, under its version's name, once it passed.
      - uses: actions/upload-artifact@v7
        if: steps.signed.outcome == 'success'
        with:
          name: apk-release
          retention-days: 1
          path: app/build/outputs/apk/release/app-release.apk

      - name: Compiler problems
        if: failure()
        run: python3 -I scripts/printCompilerProblems.py

  # Separate from "build" so the device job doesn't wait on (or get skipped by) unit tests.
  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # Save from every branch, not only the default one, so later runs skip the
          # ~10 min plugin download. This job resolves almost everything the others need.
          cache-read-only: false

      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-test-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-test-
            gradle-build-cache-

      # verifyPaparazziDebug makes the screenshot tests compare each image with its reference in
      # src/test/snapshots/ (differences are in the "test-reports" artifact). After an intended
      # UI change, re-record them: Actions > Build > Run workflow > record-screenshots.
      # It's only requested in modules that have reference images: Paparazzi's verify mode fails
      # any module with unit tests but no src/test/snapshots/ directory.
      - name: Unit and screenshot tests
        run: |
          set -o pipefail
          verify=$(find . \( -name build -o -name .gradle -o -name .git \) -prune -o \
              -path '*/src/test/snapshots' -type d -print \
              | sed -E 's#^\./(.*)/src/test/snapshots$#:\1:verifyPaparazziDebug#; s#/#:#g')
          ./gradlew testDebugUnitTest $verify --continue 2>&1 | tee gradle-output.log

      - name: Compiler problems
        if: failure()
        run: python3 -I scripts/printCompilerProblems.py

      - name: Drop build cache entries older than a week
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: find "$GRADLE_BUILD_CACHE_DIR" -maxdepth 1 -type f -mtime +7 -delete 2>/dev/null || true

      - name: Save build cache
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-test-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/
            **/build/paparazzi/failures/
          if-no-files-found: ignore

  # Runs the app on an emulator: launches each APK (debug, demo, and the signed one in a release
  # run) on a fresh install (catches startup crashes from R8, Hilt, Room), opens them the way
  # shortcuts do and presses back
  # (scripts/smokeTestApks.sh), and runs the instrumented database-migration, backup and
  # exchange-rate tests.
  device:
    needs: [plan, build, demo]
    if: needs.plan.outputs.device == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # The app's target SDK (target-sdk in gradle/libs.versions.toml).
      EMULATOR_API: 36
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Reuses what the build job just compiled for this commit, instrumented tests included.
      # Not saved again: this job adds nothing worth keeping.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-build-${{ github.sha }}
          restore-keys: gradle-build-cache-build-

      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true

      # The emulator's userdata partition needs several GB; the runner image ships toolchains
      # this job never uses, so drop them first (run 5 failed with "Not enough space").
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runs the Android version the app targets, so the behaviour that comes with
      # the target (edge-to-edge, back handling) is what gets tested. Plain Android (AOSP), like
      # a phone without Google services, when Google publishes that image; Google APIs otherwise.
      - name: Pick the emulator system image
        id: image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          available=$("$sdkmanager" --list 2>/dev/null)
          for tag in default google_apis; do
            if grep -q "system-images;android-$EMULATOR_API;$tag;x86_64" <<< "$available"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "Using system-images;android-$EMULATOR_API;$tag;x86_64"
              exit 0
            fi
          done
          echo "::error::No x86_64 system image for API $EMULATOR_API"
          exit 1

      # The system image takes 1 to 4 minutes to download from Google; bump the key's -v to
      # refresh it. The path is ANDROID_HOME's on GitHub's Ubuntu runners. The AVD isn't cached:
      # it takes 2 seconds to create, and a boot snapshot would save half a minute of booting
      # for gigabytes of the repository's 10 GB cache allowance, which Gradle's caches need.
      - name: Cache the emulator system image
        id: system-image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.EMULATOR_API }}/${{ steps.image.outputs.tag }}/x86_64
          key: system-image-${{ env.EMULATOR_API }}-${{ steps.image.outputs.tag }}-x86_64-v1

      # Google's server sometimes cuts the download short (run 16: "Error reading Zip content"),
      # and the emulator step doesn't retry, so fetch the image here first.
      - name: Download the emulator system image
        if: steps.system-image.outputs.cache-hit != 'true'
        env:
          IMAGE: system-images;android-${{ env.EMULATOR_API }};${{ steps.image.outputs.tag }};x86_64
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          for attempt in 1 2 3; do
            "$sdkmanager" --install "$IMAGE" > /dev/null && exit 0
            echo "Download failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          exit 1

      # A fresh AVD, cold-booted (-no-snapshot), so every run starts from a clean install. A phone's
      # screen: the default AVD's, 320 by 640 dp, is smaller than any phone, and onboarding's
      # buttons were below its fold.
      - name: Smoke test and instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: ${{ steps.image.outputs.tag }}
          profile: pixel_6
          disk-size: 3072M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The instrumented tests run even when the smoke test fails, whose result comes last.
          script: |
            scripts/smokeTestApks.sh apks/*.apk; echo $? > build/smoke-exit-code
            ./gradlew :shared:data:core:connectedDebugAndroidTest :shared:domain:connectedDebugAndroidTest --continue
            scripts/checkInstrumentedTestsRan.sh shared/data/core shared/domain
            exit "$(cat build/smoke-exit-code)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-results
          retention-days: 3
          path: |
            build/smoke/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore

  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Lint's per-module analysis is cacheable too, and it needs the compiled classes.
      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-lint-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-lint-
            gradle-build-cache-build-
            gradle-build-cache-

      # app's lint config has checkDependencies = true, so this covers every module.
      - name: Android Lint
        run: ./gradlew :app:lintDebug --continue

      - name: Drop build cache entries older than a week
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: find "$GRADLE_BUILD_CACHE_DIR" -maxdepth 1 -type f -mtime +7 -delete 2>/dev/null || true

      - name: Save build cache
        if: ${{ !cancelled() && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-lint-${{ github.sha }}

      # Lint's findings in the Security tab.
      - name: Upload lint results to code scanning
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Lint errors
        run: scripts/checkLintReport.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          retention-days: 3
          path: |
            app/build/reports/lint-results-debug.*
            build/reports/lint/
          if-no-files-found: ignore

  # Manual maintenance: re-records the screenshot tests' reference images on CI's Linux runner
  # (screenshots must be recorded where they are verified) and commits them to the branch it ran
  # on. Commits made with the workflow's token don't start another run.
  record-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'record-screenshots'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-test-${{ github.sha }}
          restore-keys: gradle-build-cache-

      - name: Record screenshot reference images
        run: ./gradlew cleanRecordPaparazziDebug --continue

      # A push made with the workflow's token starts no run; a dispatch does, so the new
      # references are verified on their commit without starting the build by hand.
      - name: Commit the result
        env:
          ACTION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- ':(glob)**/src/test/snapshots/**'
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "ci: $ACTION" -m "Generated by the Build workflow's $ACTION action on ${{ runner.os }}."
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f action=build

  # Keeps the signed APK: the file the demo job built and checked and the device job ran on the
  # emulator, under its version's name. Nothing is published; it's this run's artifact, kept for
  # a day, to download and install.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'release'
    needs: [plan, checks, build, test, demo, device]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk-release
          path: apk

      - name: Name it after its version
        env:
          VERSION: ${{ needs.demo.outputs.version }}
          SHA256: ${{ needs.demo.outputs.sha256 }}
          CERT: ${{ needs.demo.outputs.cert }}
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk="Nivy-$VERSION.apk"
          mv apk/app-release.apk "$apk"
          # The very file the emulator ran.
          echo "$SHA256  $apk" | sha256sum --check --strict
          {
            echo "## $apk"
            echo "Tested on the emulator, from onboarding to Home. Download it from this run's"
            echo "**Nivy-$VERSION** artifact (a zip; it's kept for a day), unzip it on the phone and open"
            echo "the APK. Android asks once to allow installing from the files app."
            echo ""
            echo "- SHA-256: \`$SHA256\`"
            if [ -n "$EXPECTED" ]; then
              echo "- Signed with the expected key: certificate \`$CERT\`"
            else
              echo "- Signed with certificate \`$CERT\`. Set the RELEASE_CERT_SHA256 repository"
              echo "  variable to it, if it's your release key's, so a release signed with another key stops."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Nivy-${{ needs.demo.outputs.version }}
          retention-days: 1
          # An APK is already compressed.
          compression-level: 0
          path: Nivy-*.apk
