# Dependency graph and dependency review.
#
# GitHub can't read a Gradle build's dependencies by itself, so `submit` resolves them and sends
# the graph to GitHub. That graph is what Dependabot's vulnerability alerts and the review below
# work from. `review` checks what a pull request changes and fails it if it adds a dependency
# with a known vulnerability.
# Both run for changes that can affect the dependencies: the Gradle build files, the version
# catalog, the wrapper, buildSrc or this workflow. Pushes to main are filtered by path; pull
# requests always start the workflow and a first job looks at what they change, so `review` is
# reported (as skipped) on every pull request and can be a required status check.
# Pull requests from forks get no write token, so neither job runs for them.
name: Dependencies

on:
  push:
    branches: [main]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - '.github/workflows/dependencies.yml'
  pull_request:
    branches: [main]

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7

      # Pushes were filtered by path above; pull requests are checked here.
      - name: Can the change affect the dependencies?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=everything
          [ "$EVENT" != pull_request ] || changed=$(scripts/changedPaths.sh || echo everything)
          if grep -qE '^everything$|^gradle/libs\.versions\.toml$|^gradle/wrapper/|\.gradle\.kts$|^gradle\.properties$|^buildSrc/|^\.github/workflows/dependencies\.yml$' <<< "$changed"; then
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependencies=false" >> "$GITHUB_OUTPUT"
            echo "No build file changed: nothing to submit or review."
          fi

  submit:
    needs: changes
    if: >-
      needs.changes.outputs.dependencies == 'true' &&
      (github.event_name == 'push' || !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The submission runs Gradle through the wrapper, and this job usually starts without the
      # Gradle caches: it runs when a build file changes, and a pull request's run can't restore
      # what its branch saved. The wrapper tries its download only once, so Gradle is downloaded
      # here first, with retries, once the wrapper is checked (the submission doesn't check it).
      - uses: gradle/actions/wrapper-validation@v6

      - name: Download Gradle
        run: scripts/downloadGradle.sh

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-provider: basic
          cache-read-only: true

  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs: submit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # GitHub processes the submitted graph in the background, so wait for it.
      - uses: actions/dependency-review-action@v5
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
